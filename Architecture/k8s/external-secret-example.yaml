apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: djassa-aws-ss
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: djassa-app-secrets
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: djassa-aws-ss
    kind: SecretStore
  target:
    name: djassa-app-secrets
    creationPolicy: Owner
  data:
    - secretKey: db_password
      remoteRef:
        key: prod/djassa/db_password
    - secretKey: storage_access_key
      remoteRef:
        key: prod/djassa/storage_access_key

# Notes:
# - This is an example for External Secrets Operator using AWS Secrets Manager.
# - Adjust provider, auth, and remoteRef paths according to your secret backend (AWS, Vault, GCP, etc.).