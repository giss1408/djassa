services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-djassa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-djassa}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "900", "1"]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      DJASSA_SECRET_KEY: ${DJASSA_SECRET_KEY:?DJASSA_SECRET_KEY must be set}
      MOBILE_MONEY_SECRETS: ${MOBILE_MONEY_SECRETS:?MOBILE_MONEY_SECRETS must be set}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      DJASSA_SECRET_KEY: ${DJASSA_SECRET_KEY:?DJASSA_SECRET_KEY must be set}
      MOBILE_MONEY_SECRETS: ${MOBILE_MONEY_SECRETS:?MOBILE_MONEY_SECRETS must be set}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  db-data:

