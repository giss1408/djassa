apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: djassa-ingress
  namespace: djassa
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  rules:
    - host: api.djassa.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: djassa-api
                port:
                  number: 80
  tls:
    - hosts:
        - api.djassa.example.com
      secretName: djassa-tls
