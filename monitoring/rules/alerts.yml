groups:
  - name: djassa.rules
    rules:
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{job="djassa-api",status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on djassa-api"

      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
